name: Feature request
description: Suggest an improvement for Japanese lyric reading or the extension experience.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or learning need
      description: What is difficult today, and who would benefit?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe what the user would see or do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or related tools.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request does not include account data or complete lyrics.
          required: true
