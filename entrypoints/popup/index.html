<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Furigana</title>
  </head>
  <body>
    <main>
      <div class="brand" aria-hidden="true">ふ</div>
      <div class="heading">
        <h1>Spotify Furigana</h1>
        <p>为日语歌词中的汉字显示读音</p>
      </div>

      <label class="setting">
        <span>
          <strong>显示振假名</strong>
          <small>设置会立即应用到已打开的歌词页</small>
        </span>
        <input id="enabled" type="checkbox" role="switch" />
      </label>

      <p class="privacy">歌词和分词均在本地浏览器内处理。</p>
      <a href="https://open.spotify.com/" target="_blank" rel="noreferrer">
        打开 Spotify Web Player
      </a>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
